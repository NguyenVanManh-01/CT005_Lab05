<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Infographic về lợi ích của công nghệ số trong học tập và video YouTube liên quan.">
	<title>Lợi ích của công nghệ số trong học tập</title>
	<style>
		:root {
			color-scheme: light;
			--navy: #092b68;
			--paper: #fff;
			--ink: #172d4d;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			background: #f1f7f8;
			color: var(--ink);
			font-family: "Trebuchet MS", Arial, sans-serif;
			line-height: 1.5;
		}

		.page {
			width: min(100% - 32px, 920px);
			margin: 32px auto;
		}

		.infographic {
			overflow: hidden;
			padding: 0;
			background: var(--paper);
			box-shadow: 0 18px 55px #183e5814;
		}

		.infographic-image {
			display: block;
			width: min(100%, 768px);
			height: auto;
			margin: 0 auto;
		}

		.video-section {
			margin: 28px 0 48px;
			padding: clamp(22px, 5vw, 40px);
			background: #fff;
			box-shadow: 0 14px 38px #183e5812;
		}

		.video-section h2 {
			margin: 0 0 18px;
			color: var(--navy);
			font-size: clamp(1.45rem, 3vw, 2rem);
		}

		.video-section h2 a {
			color: inherit;
			text-decoration: none;
		}

		.video-section h2 a:hover { text-decoration: underline; }

		.video-frame {
			position: relative;
			overflow: hidden;
			width: 100%;
			aspect-ratio: 16 / 9;
			background: #10213a;
		}

		.video-frame iframe {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			border: 0;
		}

		@media (max-width: 560px) {
			.page { width: 100%; margin: 0 auto; }
			.video-section { margin: 18px 12px 30px; }
		}
	</style>
</head>
<body>
	<main class="page">
		<article class="infographic" aria-label="Infographic về lợi ích của công nghệ số trong học tập">
			<img class="infographic-image" src="infographic.png?v=1" alt="Infographic: Lợi ích của công nghệ số trong học tập">
		</article>

		<section class="video-section" aria-labelledby="video-title">
			<h2 id="video-title"><a href="https://youtu.be/mYg8HydYyZE" target="_blank" rel="noopener noreferrer">Video YouTube</a></h2>
			<div class="video-frame">
				<iframe
					src="https://www.youtube-nocookie.com/embed/mYg8HydYyZE"
					title="Video về công nghệ số trong học tập trên YouTube"
					loading="lazy"
					referrerpolicy="strict-origin-when-cross-origin"
					allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
					allowfullscreen>
				</iframe>
			</div>
		</section>
	</main>
</body>
</html>
